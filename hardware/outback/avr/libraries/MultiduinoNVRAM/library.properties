sentence=Battery-backed NVRAM driver for the Multiduino DS1307 RTC chip.
paragraph=Provides a rich API for the 56 bytes of battery-backed NVRAM inside the DS1307 RTC. Supports typed reads/writes via templates, string storage, struct storage, CRC-8 integrity checking, magic-byte validation, and a formatted hex dump utility.
