sentence=3.3V rail power control for the Multiduino v2.
paragraph=Controls the on-board 3.3V supply rail via PE3 (D23, PIN_3V3_EN). Allows software enable and disable of the 3.3V power domain to reduce idle current when peripherals are not in use. No external library dependencies. Multiduino v2 only — the 3.3V rail enable circuit is not present on the original Multiduino.
