sentence=SHT4x humidity and temperature sensor driver for the Multiduino v2.
paragraph=I2C driver for the Sensirion SHT4x on-board sensor (address 0x44). Provides humidity (±1.8%) and temperature (±0.2°C) readings at three precision levels. Includes CRC-8 validation, soft reset, serial number read, and optional on-chip heater control. The 3.3V rail (MultiduinoPower) must be enabled before use. Multiduino v2 only.
