name=MultiduinoSD
version=2.0.0
author=Outback
maintainer=Outback
sentence=Full custom FAT16/FAT32 SD card driver for the Multiduino board.
paragraph=Native SPI + SD protocol driver (CMD0/CMD8/ACMD41/CMD17/CMD24) with integrated FAT16/FAT32 filesystem support. No dependency on the Arduino SD library. Optimised for the ATmega328P memory footprint with a single shared sector cache and up to 4 simultaneous open files. Supports 8.3 filenames, directories, file create/read/write/seek/delete, and directory listing.
