sentence=DS3231 real-time clock driver for the Multiduino v2.
paragraph=Full driver for the Maxim DS3231 temperature-compensated RTC. Provides DateTime read/write, two hardware alarms with PCINT3 interrupt support on PE1 (D21 via JP4), on-chip temperature reading, SQW square-wave output, 32KHz output, and oscillator stop detection. No NVRAM — use MultiduinoFRAM for non-volatile storage on v2. Multiduino v2 only — the original Multiduino uses a DS1307 (see MultiduinoRTC).
