sentence=4KB I2C EEPROM driver with unique serial number for the Multiduino v2.
paragraph=I2C driver for the on-board 32Kbit EEPROM (data at address 0x50, serial number at 0x58). Provides byte, page, block, and typed read/write with automatic write-cycle wait. The factory-programmed 64-bit unique serial number at 0x58 can be used as a device fingerprint. Intended for infrequent writes of configuration data — for high-frequency writes use MultiduinoFRAM. The 3.3V rail (MultiduinoPower) must be enabled before use. Multiduino v2 only.
