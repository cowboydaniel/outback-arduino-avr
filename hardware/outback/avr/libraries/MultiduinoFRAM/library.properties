sentence=8KB FRAM non-volatile memory driver for the Multiduino v2.
paragraph=I2C driver for the on-board 64Kbit ferroelectric RAM (address 0x57). Provides byte, block, and typed read/write with no write delay (FRAM writes are effectively instant). Supports ~100 trillion write cycles — suitable for high-frequency data logging where EEPROM wear would be a concern. The 3.3V rail (MultiduinoPower) must be enabled before use. Multiduino v2 only.
