sentence=SPI SRAM driver for the Multiduino v2 on-board 23AA02M 256KB chip.
paragraph=Native SPI driver for the Microchip 23AA02M 2Mbit SPI SRAM. Supports single-byte, block, and typed (template) read/write, sequential-mode streaming, fill, clear, and hex dump. CS pin is fixed to D9 (PIN_SPI_SS_SRAM). Multiduino v2 only — the SRAM chip is not present on the original Multiduino.
